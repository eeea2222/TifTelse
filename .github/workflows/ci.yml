name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lint tooling
        run: python -m pip install --upgrade pip ruff mypy
      - name: Ruff
        run: ruff check .
      # mypy runs hermetically: ignore_missing_imports treats torch/numpy as Any,
      # so type-checking stays pinned to this package's own code rather than
      # drifting with whichever torch stub version a torch install would resolve.
      - name: Mypy
        run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test deps (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]" --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Run tests
        run: pytest -q
